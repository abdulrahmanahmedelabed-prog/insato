# Cloudflare Worker for the Insato live-call signaling relay (free plan:
# SQLite-backed Durable Objects). Deploy with `wrangler deploy` from this
# folder; see docs/SETUP.md.
name = "insato-signaling"
main = "worker.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
