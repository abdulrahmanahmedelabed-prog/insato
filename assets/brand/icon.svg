<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Insato app icon: speech (sound bars, right) becomes written lines flowing
       right-to-left like Arabic script, ending in an ink dot. Brand tokens:
       background #16804F to #0A4A2D, ink #FFFFFF, accent #E2AA4E. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16804F"/>
      <stop offset="1" stop-color="#0A4A2D"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g id="mark">
    <g fill="#FFFFFF">
      <rect x="776" y="452" width="56" height="120" rx="28"/>
      <rect x="680" y="372" width="56" height="280" rx="28"/>
      <rect x="584" y="300" width="56" height="424" rx="28"/>
      <rect x="488" y="400" width="56" height="224" rx="28"/>
    </g>
    <path d="M448 512 H268" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/>
    <path d="M448 628 H328" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round" opacity=".55"/>
    <circle cx="200" cy="512" r="40" fill="#E2AA4E"/>
  </g>
</svg>
