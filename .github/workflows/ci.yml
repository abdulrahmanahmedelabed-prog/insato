# Continuous integration: static analysis + unit/widget tests on every push
# and pull request. Mirrors what a developer runs locally (see docs/SETUP.md).
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs of the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check generated code is up to date
        # drift's *.g.dart files are committed and the release workflow
        # (build.yml) builds from the committed files only. Regenerate and
        # fail if any generated file is modified OR untracked (a new part
        # file someone forgot to `git add`): `git diff` alone only sees
        # tracked files, `git status --porcelain` reports both.
        shell: bash
        run: |
          set -euo pipefail
          dart run build_runner build --delete-conflicting-outputs
          changed="$(git status --porcelain --untracked-files=all -- '*.g.dart')"
          if [[ -n "${changed}" ]]; then
            echo "${changed}"
            git --no-pager diff -- '*.g.dart'
            echo "::error::Generated files are stale or uncommitted. Run 'dart run build_runner build --delete-conflicting-outputs' and commit the result."
            exit 1
          fi

      - name: Analyze
        # Fails on errors, warnings and infos (see analysis_options.yaml).
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
