name: Landing page

# Publishes site/index.html to GitHub Pages.
# One-time setup by the repository owner: Settings → Pages → Build and
# deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main, claude/katib-v1]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build page
        run: |
          mkdir -p _site
          {
            echo '<!doctype html>'
            echo '<html lang="en" dir="ltr">'
            echo '<head>'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
            echo '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>'
            echo '</head>'
            echo '<body>'
            cat site/index.html
            echo '</body>'
            echo '</html>'
          } > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
