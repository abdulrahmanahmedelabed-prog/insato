# Release builds for Android, Windows and iOS.
#
# * Push a tag `vX.Y.Z` (matching `version:` in pubspec.yaml) to build all
#   platforms and publish a GitHub Release with the artifacts.
# * Run manually ("Run workflow") to build artifacts without releasing.
#
# Android signing: when the repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are
# set, APKs/AAB are signed with that upload key; otherwise they are signed
# with the debug key (installable for testing, not uploadable to Google Play).
# iOS: the IPA is UNSIGNED and must be re-signed before installation.
name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      build_number: ${{ steps.read.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read pubspec version and verify tag
        id: read
        shell: bash
        run: |
          set -euo pipefail
          raw="$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]*(#.*)?$//')"
          version="${raw%%+*}"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read 'version:' from pubspec.yaml"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${version}"
              exit 1
            fi
          fi
          # Monotonic build number (Android versionCode / iOS CFBundleVersion).
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building Katib ${version} (build ${GITHUB_RUN_NUMBER})"

  build-android:
    name: Android (APK + AAB)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NAME: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::No signing secrets configured; release artifacts will be signed with the debug key."
            exit 0
          fi
          keystore="${RUNNER_TEMP}/upload-keystore.jks"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          {
            echo "storeFile=${keystore}"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/key.properties
          echo "Release signing configured."

      - name: Build split APKs
        run: >-
          flutter build apk --release --split-per-abi
          --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Build app bundle
        run: >-
          flutter build appbundle --release
          --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk" "dist/katib-${BUILD_NAME}-android-${abi}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/katib-${BUILD_NAME}-android.aab"
          ls -lh dist

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties "${RUNNER_TEMP}/upload-keystore.jks"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: katib-android
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BUILD_NAME: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --build-name="$env:BUILD_NAME" --build-number="$env:BUILD_NUMBER"

      - name: Package ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/katib-$env:BUILD_NAME-windows-x64.zip"
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: katib-windows
          path: dist/*
          if-no-files-found: error

  build-ios:
    name: iOS (unsigned IPA)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUILD_NAME: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release (no code signing)
        run: >-
          flutter build ios --release --no-codesign
          --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          test -d "$app" || { echo "::error::$app not found"; exit 1; }
          staging="$(mktemp -d)"
          mkdir -p "$staging/Payload" dist
          cp -R "$app" "$staging/Payload/"
          (cd "$staging" && zip -qry "$GITHUB_WORKSPACE/dist/katib-${BUILD_NAME}-ios-unsigned.ipa" Payload)
          ls -lh dist

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: katib-ios
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [version, build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: katib-*
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Katib ${{ needs.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          # Tags such as v1.2.0-beta.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
