# Static analysis configuration for Katib (كاتب).
#
# Base: the Flutter team's recommended set (package:flutter_lints), plus a
# small number of stricter rules that catch real bugs (unawaited futures,
# leaked subscriptions, missing return types) or keep the codebase
# consistent. Every rule below is compatible with the others and with
# `dart format`; none of them require a particular import style.
#
# CI runs `flutter analyze`, which fails on errors, warnings AND infos, so a
# rule listed here is effectively mandatory. Suppress a single, justified
# occurrence with `// ignore: <rule>` and a comment explaining why.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated code (drift, build_runner) is never hand-edited.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - coverage/**
    - android/**
    - ios/**
    - windows/**
  language:
    # Forbid untyped generic types such as a bare `List` or `Future`.
    strict-raw-types: true
  errors:
    # These indicate genuine defects; surface them as errors, not hints.
    missing_required_param: error
    missing_return: error
    unawaited_futures: warning
    cancel_subscriptions: warning

linter:
  rules:
    # --- Requested project rules -------------------------------------------
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters

    # --- Async & resource safety -------------------------------------------
    # A recorder or isolate stream that is never cancelled leaks native
    # resources (microphone, FFI handles) for the life of the app.
    - cancel_subscriptions
    - unnecessary_await_in_return
    - throw_in_finally

    # --- Correctness ---------------------------------------------------------
    - only_throw_errors
    - test_types_in_equals
    - no_adjacent_strings_in_list
    - literal_only_boolean_expressions

    # --- Consistency ---------------------------------------------------------
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_in_for_each
    - use_named_constants
